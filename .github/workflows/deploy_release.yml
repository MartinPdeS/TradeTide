name: Publish release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    # Validate Conda metadata before publishing and install the .conda archive reader.
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@v18
    with:
      documentation: true
      documentation_package_name: TradeTide
      documentation_python_version: "3.11"
      documentation_apt_package: xvfb jq
      debug: true
      pypi_python_version: "3.13"
      pypi_build_linux: true
      pypi_build_macos: true
      pypi_build_windows: true
      # The toolchain group pulls in GDB's Python, which shadows setup-python
      # when the shared workflow adds mingw64/bin to PATH.
      # gcc-libs supplies OpenMP on both older MSYS2 snapshots and newer
      # repositories where libgomp is a separate dependency.
      pypi_mingw_package: |
        mingw-w64-x86_64-gcc
        mingw-w64-x86_64-gcc-libs
        mingw-w64-x86_64-ninja
        mingw-w64-x86_64-gcc-fortran
        mingw-w64-x86_64-pkg-config
      conda_python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      conda_os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      conda_package_name: tradetide
      conda_recipe_path: conda.recipe/meta.yaml
      conda_test_import: TradeTide
      conda_tools_python_version: "3.11"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
